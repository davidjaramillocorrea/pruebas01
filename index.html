<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Una página de prueba estática para el repositorio pruebas01."
    />
    <title>Pruebas01 · Página de prueba</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0b1020;
        color: #f5f7ff;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 2rem;
        background:
          radial-gradient(circle at 15% 20%, #5d45d980, transparent 28rem),
          radial-gradient(circle at 85% 80%, #00b8a940, transparent 24rem),
          #0b1020;
      }

      main {
        width: min(100%, 700px);
        padding: clamp(2rem, 6vw, 4rem);
        border: 1px solid #ffffff22;
        border-radius: 24px;
        background: #121a31cc;
        box-shadow: 0 24px 80px #03061188;
        backdrop-filter: blur(12px);
      }

      .tag {
        display: inline-block;
        margin: 0 0 1rem;
        padding: 0.45rem 0.75rem;
        border-radius: 99px;
        background: #7867ff33;
        color: #d7d2ff;
        font-size: 0.85rem;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.3rem, 8vw, 4.8rem);
        line-height: 1;
        letter-spacing: -0.06em;
      }

      p {
        max-width: 56ch;
        margin: 1.5rem 0 2rem;
        color: #c2cbe7;
        font-size: 1.1rem;
        line-height: 1.65;
      }

      .panel {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        padding: 1rem 1.2rem;
        border-radius: 14px;
        background: #ffffff0d;
      }

      #status { color: #75edc9; font-weight: 700; }

      button {
        cursor: pointer;
        border: 0;
        border-radius: 10px;
        padding: 0.7rem 1rem;
        background: #8b7cff;
        color: #fff;
        font: inherit;
        font-weight: 750;
        transition: transform 150ms ease, background 150ms ease;
      }

      button:hover { background: #a095ff; transform: translateY(-2px); }
      button:focus-visible { outline: 3px solid #75edc9; outline-offset: 3px; }

      @media (max-width: 520px) {
        .panel { align-items: stretch; flex-direction: column; }
      }
    </style>
  </head>
  <body>
    <main>
      <span class="tag">Proyecto de práctica</span>
      <h1>¡Hola, web!</h1>
      <p>
        Esta página vive en el repositorio <strong>pruebas01</strong>. Es una base
        mínima para experimentar: guarda cambios, revísalos en el navegador y
        publícalos con Git.
      </p>
      <div class="panel">
        <span id="status" role="status">Página lista para usar</span>
        <button type="button" id="test-button">Probar interacción</button>
      </div>
    </main>
    <script>
      const button = document.querySelector("#test-button");
      const status = document.querySelector("#status");

      button.addEventListener("click", () => {
        status.textContent = "¡Funciona! Cambiaste el contenido con JavaScript.";
        button.textContent = "Probado ✓";
      });
    </script>
  </body>
</html>
